[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-task-bot"
version = "0.1.0"
description = "Graba lo que haces en una página web una vez y repítelo para cada fila de un Excel/CSV."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "playwright>=1.45",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wtb = "webtaskbot.cli:main"

[tool.setuptools.packages.find]
include = ["webtaskbot*"]

[tool.setuptools.package-data]
webtaskbot = ["js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
